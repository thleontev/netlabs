name: Validate MPLS EVE-NG labs

on:
  push:
    paths:
      - 'eve-ng/MPLS/**'
      - '.github/workflows/validate-mpls-eve.yml'
  pull_request:
    paths:
      - 'eve-ng/MPLS/**'
      - '.github/workflows/validate-mpls-eve.yml'

permissions:
  contents: read

jobs:
  validate-mpls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify lab structure and embedded startup-configs
        run: |
          python3 "eve-ng/MPLS/MPLS Service Provider Advanced/tools/validate_lab.py"
          python3 "eve-ng/MPLS/MPLS Service Provider Advanced/tools/validate_startup_configs.py"
      - name: Verify generated EVE-NG labs are reproducible
        run: |
          python3 "eve-ng/MPLS/MPLS Service Provider Advanced/tools/embed_startup_configs.py"
          git diff --exit-code -- "eve-ng/MPLS/MPLS Service Provider Advanced/MPLS-SP-Advanced-AUTO-L3VPN.unl" "eve-ng/MPLS/MPLS Service Provider Advanced/MPLS-SP-Advanced-AUTO-LDP.unl" "eve-ng/MPLS/MPLS Service Provider Advanced/MPLS-SP-Advanced-AUTO-UNDERLAY.unl"
