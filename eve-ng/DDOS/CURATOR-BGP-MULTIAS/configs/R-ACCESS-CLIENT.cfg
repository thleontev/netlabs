hostname R-ACCESS-CLIENT
no ip domain-lookup
!
interface GigabitEthernet0/0
 description UPSTREAM_TO_TRANSIT
 ip address 10.1.0.14 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN_CLIENT
 ip address 198.18.100.1 255.255.255.0
 no shutdown
!
ip prefix-list ACCESS-CLIENT seq 5 permit 198.18.100.0/24
ip prefix-list PROTECTED seq 5 permit 203.0.113.0/24
ip prefix-list ONLY-DEFAULT seq 5 permit 0.0.0.0/0
!
router bgp 65031
 bgp log-neighbor-changes
 network 198.18.100.0 mask 255.255.255.0
 neighbor 10.1.0.13 remote-as 65000
 neighbor 10.1.0.13 prefix-list PROTECTED in
 neighbor 10.1.0.13 prefix-list ACCESS-CLIENT out
!
end
