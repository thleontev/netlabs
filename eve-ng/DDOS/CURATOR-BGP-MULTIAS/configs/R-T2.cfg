hostname R-T2
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TRANSIT_TO_T1_AS65000
 ip address 10.1.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO_CUR2_AS65020
 ip address 10.1.0.17 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description TO_ISP2_AS65012
 ip address 10.1.0.21 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description TO_BOT1_AS65041
 ip address 10.1.0.25 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/4
 description TO_BOT2_AS65042
 ip address 10.1.0.29 255.255.255.252
 no shutdown
!
ip prefix-list PROTECTED seq 5 permit 203.0.113.0/24
ip prefix-list POP-ENDPOINTS seq 5 permit 198.18.0.21/32
ip prefix-list POP-ENDPOINTS seq 10 permit 198.18.0.22/32
ip prefix-list UNDERLAY-WANS seq 5 permit 198.18.11.0/30
ip prefix-list UNDERLAY-WANS seq 10 permit 198.18.12.0/30
ip prefix-list ACCESS-CLIENT seq 5 permit 198.18.100.0/24
ip prefix-list ACCESS-BOT1 seq 5 permit 198.18.101.0/24
ip prefix-list ACCESS-BOT2 seq 5 permit 198.18.102.0/24
ip prefix-list TRANSIT-SAFE seq 5 permit 203.0.113.0/24
ip prefix-list TRANSIT-SAFE seq 10 permit 198.18.0.21/32
ip prefix-list TRANSIT-SAFE seq 15 permit 198.18.0.22/32
ip prefix-list TRANSIT-SAFE seq 20 permit 198.18.11.0/30
ip prefix-list TRANSIT-SAFE seq 25 permit 198.18.12.0/30
ip prefix-list TRANSIT-SAFE seq 30 permit 198.18.100.0/24
ip prefix-list TRANSIT-SAFE seq 35 permit 198.18.101.0/24
ip prefix-list TRANSIT-SAFE seq 40 permit 198.18.102.0/24
!
ip prefix-list CUR2-IN seq 5 permit 198.18.0.22/32
ip prefix-list CUR2-IN seq 10 permit 203.0.113.0/24
ip prefix-list ISP2-IN seq 5 permit 198.18.12.0/30
!
router bgp 65001
 bgp log-neighbor-changes
 neighbor 10.1.0.1 remote-as 65000
 neighbor 10.1.0.1 prefix-list TRANSIT-SAFE in
 neighbor 10.1.0.1 prefix-list TRANSIT-SAFE out
 neighbor 10.1.0.18 remote-as 65020
 neighbor 10.1.0.18 prefix-list CUR2-IN in
 neighbor 10.1.0.18 prefix-list UNDERLAY-WANS out
 neighbor 10.1.0.22 remote-as 65012
 neighbor 10.1.0.22 prefix-list ISP2-IN in
 neighbor 10.1.0.22 prefix-list POP-ENDPOINTS out
 neighbor 10.1.0.26 remote-as 65041
 neighbor 10.1.0.26 prefix-list ACCESS-BOT1 in
 neighbor 10.1.0.26 prefix-list PROTECTED out
 neighbor 10.1.0.30 remote-as 65042
 neighbor 10.1.0.30 prefix-list ACCESS-BOT2 in
 neighbor 10.1.0.30 prefix-list PROTECTED out
 neighbor 10.1.0.26 default-originate
 neighbor 10.1.0.30 default-originate
!
end
