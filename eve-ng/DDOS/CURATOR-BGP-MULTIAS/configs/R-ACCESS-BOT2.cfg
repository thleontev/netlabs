hostname R-ACCESS-BOT2
no ip domain-lookup
!
interface GigabitEthernet0/0
 description UPSTREAM_TO_TRANSIT
 ip address 10.1.0.30 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN_BOT2
 ip address 198.18.102.1 255.255.255.0
 no shutdown
!
ip prefix-list ACCESS-BOT2 seq 5 permit 198.18.102.0/24
ip prefix-list PROTECTED seq 5 permit 203.0.113.0/24
ip prefix-list ONLY-DEFAULT seq 5 permit 0.0.0.0/0
!
router bgp 65042
 bgp log-neighbor-changes
 network 198.18.102.0 mask 255.255.255.0
 neighbor 10.1.0.29 remote-as 65001
 neighbor 10.1.0.29 prefix-list PROTECTED in
 neighbor 10.1.0.29 prefix-list ACCESS-BOT2 out
!
end
