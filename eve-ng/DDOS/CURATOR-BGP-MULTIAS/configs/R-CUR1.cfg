hostname R-CUR1
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TRANSIT_INBOUND_AND_OUTBOUND
 ip address 10.1.0.6 255.255.255.252
 ip access-group SCRUB-POLICY in
 no shutdown
!
interface GigabitEthernet0/1
 description PRIVATE_BACKBONE_TO_ROUTE_REFLECTOR
 ip address 10.2.0.1 255.255.255.252
 no shutdown
!
interface Loopback0
 description GRE_ENDPOINT_AND_IBGP_PEERING
 ip address 198.18.0.21 255.255.255.255
 no shutdown
!
interface Tunnel1
 description SCRUBBED_GRE_TO_CE_1
 ip address 172.31.1.1 255.255.255.252
 ip mtu 1476
 ip tcp adjust-mss 1436
 tunnel source Loopback0
 tunnel destination 198.18.11.2
 tunnel mode gre ip
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.1.0.5
!
ip access-list extended SCRUB-POLICY
 remark TRAINING ACL ONLY - not production anti-DDoS
 deny icmp host 198.18.101.10 host 203.0.113.10 echo
 deny icmp host 198.18.102.10 host 203.0.113.10 echo
 deny tcp host 198.18.101.10 host 203.0.113.10 eq 80
 deny tcp host 198.18.102.10 host 203.0.113.10 eq 80
 permit ip any any
!
router ospf 20
 router-id 198.18.0.21
 passive-interface default
 no passive-interface GigabitEthernet0/1
 network 10.2.0.1 0.0.0.0 area 0
 network 198.18.0.21 0.0.0.0 area 0
!
ip prefix-list PROTECTED seq 5 permit 203.0.113.0/24
ip prefix-list ONLY-DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list UNDERLAY-WANS seq 5 permit 198.18.11.0/30
ip prefix-list UNDERLAY-WANS seq 10 permit 198.18.12.0/30
!
ip prefix-list POP-LOCAL seq 5 permit 198.18.0.21/32
ip prefix-list POP-LOCAL seq 10 permit 203.0.113.0/24
router bgp 65020
 bgp log-neighbor-changes
 bgp router-id 198.18.0.21
 network 198.18.0.21 mask 255.255.255.255
 neighbor 10.1.0.5 remote-as 65000
 neighbor 10.1.0.5 prefix-list UNDERLAY-WANS in
 neighbor 10.1.0.5 prefix-list POP-LOCAL out
 neighbor 172.31.1.2 remote-as 65010
 neighbor 172.31.1.2 prefix-list PROTECTED in
 neighbor 172.31.1.2 prefix-list ONLY-DEFAULT out
 neighbor 172.31.1.2 default-originate
 neighbor 172.31.1.2 timers 10 30
 neighbor 198.19.0.200 remote-as 65020
 neighbor 198.19.0.200 prefix-list PROTECTED in
 neighbor 198.19.0.200 prefix-list PROTECTED out
 neighbor 198.19.0.200 update-source Loopback0
 neighbor 198.19.0.200 next-hop-self
!
end
