hostname R-CUR-RR
no ip domain-lookup
!
interface GigabitEthernet0/0
 description BACKBONE_TO_POP1
 ip address 10.2.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description BACKBONE_TO_POP2
 ip address 10.2.0.6 255.255.255.252
 no shutdown
!
interface Loopback0
 description RR_LOOPBACK
 ip address 198.19.0.200 255.255.255.255
 no shutdown
!
router ospf 20
 router-id 198.19.0.200
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 network 10.2.0.2 0.0.0.0 area 0
 network 10.2.0.6 0.0.0.0 area 0
 network 198.19.0.200 0.0.0.0 area 0
!
ip prefix-list PROTECTED seq 5 permit 203.0.113.0/24
!
router bgp 65020
 bgp log-neighbor-changes
 bgp router-id 198.19.0.200
 neighbor 198.18.0.21 remote-as 65020
 neighbor 198.18.0.21 prefix-list PROTECTED in
 neighbor 198.18.0.21 prefix-list PROTECTED out
 neighbor 198.18.0.21 update-source Loopback0
 neighbor 198.18.0.21 route-reflector-client
 neighbor 198.18.0.22 remote-as 65020
 neighbor 198.18.0.22 prefix-list PROTECTED in
 neighbor 198.18.0.22 prefix-list PROTECTED out
 neighbor 198.18.0.22 update-source Loopback0
 neighbor 198.18.0.22 route-reflector-client
!
end
