hostname R-ACCESS-BOT1
no ip domain-lookup
!
interface GigabitEthernet0/0
 description UPSTREAM_TO_TRANSIT
 ip address 10.1.0.26 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LAN_BOT1
 ip address 198.18.101.1 255.255.255.0
 no shutdown
!
ip prefix-list ACCESS-BOT1 seq 5 permit 198.18.101.0/24
ip prefix-list PROTECTED seq 5 permit 203.0.113.0/24
ip prefix-list ONLY-DEFAULT seq 5 permit 0.0.0.0/0
!
router bgp 65041
 bgp log-neighbor-changes
 network 198.18.101.0 mask 255.255.255.0
 neighbor 10.1.0.25 remote-as 65001
 neighbor 10.1.0.25 prefix-list PROTECTED in
 neighbor 10.1.0.25 prefix-list ACCESS-BOT1 out
!
end
