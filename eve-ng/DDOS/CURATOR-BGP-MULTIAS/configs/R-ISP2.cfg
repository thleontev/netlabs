hostname R-ISP2
no ip domain-lookup
!
interface GigabitEthernet0/0
 description UPSTREAM_TRANSIT
 ip address 10.1.0.22 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description CE_UNDERLAY
 ip address 198.18.12.1 255.255.255.252
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.1.0.21
!
ip prefix-list POP-ENDPOINTS seq 5 permit 198.18.0.21/32
ip prefix-list POP-ENDPOINTS seq 10 permit 198.18.0.22/32
ip prefix-list ONLY-DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list DENY-ALL seq 5 deny 0.0.0.0/0 le 32
!
ip prefix-list ISP2-EXPORT seq 5 permit 198.18.12.0/30
router bgp 65012
 bgp log-neighbor-changes
 network 198.18.12.0 mask 255.255.255.252
 neighbor 10.1.0.21 remote-as 65001
 neighbor 10.1.0.21 prefix-list POP-ENDPOINTS in
 neighbor 10.1.0.21 prefix-list ISP2-EXPORT out
 neighbor 198.18.12.2 remote-as 65010
 neighbor 198.18.12.2 prefix-list DENY-ALL in
 neighbor 198.18.12.2 prefix-list ONLY-DEFAULT out
 neighbor 198.18.12.2 default-originate
!
end
