hostname R-T1
no ip domain-lookup
!
interface GigabitEthernet0/0
 description TRANSIT_TO_T2_AS65001
 ip address 10.1.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO_CUR1_AS65020
 ip address 10.1.0.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description TO_ISP1_AS65011
 ip address 10.1.0.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description TO_CLIENT_ACCESS_AS65031
 ip address 10.1.0.13 255.255.255.252
 no shutdown
!
ip prefix-list PROTECTED seq 5 permit 203.0.113.0/24
ip prefix-list POP-ENDPOINTS seq 5 permit 198.18.0.21/32
ip prefix-list POP-ENDPOINTS seq 10 permit 198.18.0.22/32
ip prefix-list UNDERLAY-WANS seq 5 permit 198.18.11.0/30
ip prefix-list UNDERLAY-WANS seq 10 permit 198.18.12.0/30
ip prefix-list ACCESS-CLIENT seq 5 permit 198.18.100.0/24
ip prefix-list ACCESS-BOT1 seq 5 permit 198.18.101.0/24
ip prefix-list ACCESS-BOT2 seq 5 permit 198.18.102.0/24
ip prefix-list TRANSIT-SAFE seq 5 permit 203.0.113.0/24
ip prefix-list TRANSIT-SAFE seq 10 permit 198.18.0.21/32
ip prefix-list TRANSIT-SAFE seq 15 permit 198.18.0.22/32
ip prefix-list TRANSIT-SAFE seq 20 permit 198.18.11.0/30
ip prefix-list TRANSIT-SAFE seq 25 permit 198.18.12.0/30
ip prefix-list TRANSIT-SAFE seq 30 permit 198.18.100.0/24
ip prefix-list TRANSIT-SAFE seq 35 permit 198.18.101.0/24
ip prefix-list TRANSIT-SAFE seq 40 permit 198.18.102.0/24
!
ip prefix-list CUR1-IN seq 5 permit 198.18.0.21/32
ip prefix-list CUR1-IN seq 10 permit 203.0.113.0/24
ip prefix-list ISP1-IN seq 5 permit 198.18.11.0/30
!
route-map FROM-ISP1 permit 10
 match ip address prefix-list PROTECTED
 set local-preference 350
route-map FROM-ISP1 permit 20
 set local-preference 100
!
router bgp 65000
 bgp log-neighbor-changes
 neighbor 10.1.0.2 remote-as 65001
 neighbor 10.1.0.2 prefix-list TRANSIT-SAFE in
 neighbor 10.1.0.2 prefix-list TRANSIT-SAFE out
 neighbor 10.1.0.6 remote-as 65020
 neighbor 10.1.0.6 prefix-list CUR1-IN in
 neighbor 10.1.0.6 prefix-list UNDERLAY-WANS out
 neighbor 10.1.0.10 remote-as 65011
 neighbor 10.1.0.10 prefix-list ISP1-IN in
 neighbor 10.1.0.10 route-map FROM-ISP1 in
 neighbor 10.1.0.10 prefix-list POP-ENDPOINTS out
 neighbor 10.1.0.14 remote-as 65031
 neighbor 10.1.0.14 prefix-list ACCESS-CLIENT in
 neighbor 10.1.0.14 prefix-list PROTECTED out
 neighbor 10.1.0.14 default-originate
!
end
