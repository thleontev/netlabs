hostname R-CE
no ip domain-lookup
!
interface GigabitEthernet0/0
 description ISP1_UNDERLAY
 ip address 198.18.11.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description ISP2_UNDERLAY
 ip address 198.18.12.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description PROTECTED_SERVER_LAN
 ip address 203.0.113.1 255.255.255.0
 no shutdown
!
interface Tunnel1
 description OVER_ISP1_TO_CUR1
 ip address 172.31.1.2 255.255.255.252
 ip mtu 1476
 ip tcp adjust-mss 1436
 tunnel source GigabitEthernet0/0
 tunnel destination 198.18.0.21
 tunnel mode gre ip
 no shutdown
!
interface Tunnel2
 description OVER_ISP2_TO_CUR2
 ip address 172.31.2.2 255.255.255.252
 ip mtu 1476
 ip tcp adjust-mss 1436
 tunnel source GigabitEthernet0/1
 tunnel destination 198.18.0.22
 tunnel mode gre ip
 no shutdown
!
! Pin GRE underlay to physically separate ISPs (prevent recursive routing).
ip route 198.18.0.21 255.255.255.255 198.18.11.1
ip route 198.18.0.22 255.255.255.255 198.18.12.1
!
ip prefix-list PROTECTED seq 5 permit 203.0.113.0/24
ip prefix-list ONLY-DEFAULT seq 5 permit 0.0.0.0/0
ip prefix-list DENY-ALL seq 5 deny 0.0.0.0/0 le 32
!
route-map PREF-CUR1 permit 10
 set local-preference 250
route-map PREF-CUR2 permit 10
 set local-preference 200
route-map PREF-ISP1 permit 10
 set local-preference 90
route-map PREF-ISP2 permit 10
 set local-preference 80
!
router bgp 65010
 bgp log-neighbor-changes
 network 203.0.113.0 mask 255.255.255.0
 neighbor 198.18.11.1 remote-as 65011
 neighbor 198.18.11.1 prefix-list ONLY-DEFAULT in
 neighbor 198.18.11.1 prefix-list DENY-ALL out
 neighbor 198.18.11.1 route-map PREF-ISP1 in
 neighbor 198.18.12.1 remote-as 65012
 neighbor 198.18.12.1 prefix-list ONLY-DEFAULT in
 neighbor 198.18.12.1 prefix-list DENY-ALL out
 neighbor 198.18.12.1 route-map PREF-ISP2 in
 neighbor 172.31.1.1 remote-as 65020
 neighbor 172.31.1.1 prefix-list ONLY-DEFAULT in
 neighbor 172.31.1.1 prefix-list PROTECTED out
 neighbor 172.31.1.1 route-map PREF-CUR1 in
 neighbor 172.31.1.1 timers 10 30
 neighbor 172.31.2.1 remote-as 65020
 neighbor 172.31.2.1 prefix-list ONLY-DEFAULT in
 neighbor 172.31.2.1 prefix-list PROTECTED out
 neighbor 172.31.2.1 route-map PREF-CUR2 in
 neighbor 172.31.2.1 timers 10 30
!
end
