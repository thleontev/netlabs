hostname ISP-B
no ip domain-lookup
ip cef
!
interface GigabitEthernet0/0
 description LINK_PE2
 ip address 10.10.0.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LINK_INET-SIM
 ip address 10.10.0.13 255.255.255.252
 no shutdown
!
ip prefix-list PFX_EXT seq 5 permit 198.51.100.0/24
ip prefix-list PFX_CLIENT_A seq 5 permit 203.0.113.0/24
!
router bgp 65200
 bgp router-id 10.10.0.6
 bgp log-neighbor-changes
 neighbor 10.10.0.5 remote-as 65000
 neighbor 10.10.0.5 prefix-list PFX_CLIENT_A in
 neighbor 10.10.0.5 prefix-list PFX_EXT out
 neighbor 10.10.0.14 remote-as 65300
 neighbor 10.10.0.14 prefix-list PFX_EXT in
 neighbor 10.10.0.14 prefix-list PFX_CLIENT_A out
!
end
