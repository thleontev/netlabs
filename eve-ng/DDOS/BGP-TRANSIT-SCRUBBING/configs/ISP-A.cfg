hostname ISP-A
no ip domain-lookup
ip cef
!
interface GigabitEthernet0/0
 description LINK_PE1
 ip address 10.10.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LINK_INET-SIM
 ip address 10.10.0.9 255.255.255.252
 no shutdown
!
ip prefix-list PFX_EXT seq 5 permit 198.51.100.0/24
ip prefix-list PFX_CLIENT_A seq 5 permit 203.0.113.0/24
!
router bgp 65100
 bgp router-id 10.10.0.2
 bgp log-neighbor-changes
 neighbor 10.10.0.1 remote-as 65000
 neighbor 10.10.0.1 prefix-list PFX_CLIENT_A in
 neighbor 10.10.0.1 prefix-list PFX_EXT out
 neighbor 10.10.0.10 remote-as 65300
 neighbor 10.10.0.10 prefix-list PFX_EXT in
 neighbor 10.10.0.10 prefix-list PFX_CLIENT_A out
!
end
