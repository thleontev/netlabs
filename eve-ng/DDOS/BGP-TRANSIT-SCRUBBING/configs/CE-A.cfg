hostname CE-A
no ip domain-lookup
ip cef
!
interface GigabitEthernet0/0
 description LINK_PE1
 ip address 10.20.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LINK_PE2
 ip address 10.20.0.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description LINK_HOST-A
 ip address 203.0.113.1 255.255.255.0
 no shutdown
!
ip prefix-list PFX_EXT seq 5 permit 198.51.100.0/24
ip prefix-list PFX_CLIENT_A seq 5 permit 203.0.113.0/24
!
router bgp 65010
 bgp router-id 203.0.113.1
 bgp log-neighbor-changes
 network 203.0.113.0 mask 255.255.255.0
 neighbor 10.20.0.1 remote-as 65000
 neighbor 10.20.0.1 prefix-list PFX_EXT in
 neighbor 10.20.0.1 prefix-list PFX_CLIENT_A out
 neighbor 10.20.0.1 weight 200
 neighbor 10.20.0.5 remote-as 65000
 neighbor 10.20.0.5 prefix-list PFX_EXT in
 neighbor 10.20.0.5 prefix-list PFX_CLIENT_A out
!
end
