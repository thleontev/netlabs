hostname PE2
no ip domain-lookup
ip cef
!
interface GigabitEthernet0/0
 description LINK_CORE-RR
 ip address 10.0.0.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LINK_PE1
 ip address 10.0.0.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description LINK_ISP-B
 ip address 10.10.0.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description LINK_CE-A
 ip address 10.20.0.5 255.255.255.252
 no shutdown
!
interface Loopback0
 ip address 10.255.0.2 255.255.255.255
!
router ospf 100
 router-id 10.255.0.2
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 network 10.0.0.4 0.0.0.3 area 0
 network 10.0.0.8 0.0.0.3 area 0
 network 10.255.0.2 0.0.0.0 area 0
!
ip prefix-list PFX_EXT seq 5 permit 198.51.100.0/24
ip prefix-list PFX_CLIENT_A seq 5 permit 203.0.113.0/24
!
router bgp 65000
 bgp router-id 10.255.0.2
 bgp log-neighbor-changes
 neighbor 10.255.0.3 remote-as 65000
 neighbor 10.255.0.3 update-source Loopback0
 neighbor 10.255.0.3 next-hop-self
 neighbor 10.10.0.6 remote-as 65200
 neighbor 10.10.0.6 prefix-list PFX_EXT in
 neighbor 10.10.0.6 prefix-list PFX_CLIENT_A out
 neighbor 10.20.0.6 remote-as 65010
 neighbor 10.20.0.6 prefix-list PFX_CLIENT_A in
 neighbor 10.20.0.6 prefix-list PFX_EXT out
!
end
