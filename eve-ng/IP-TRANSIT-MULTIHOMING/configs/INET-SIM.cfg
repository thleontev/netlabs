hostname INET-SIM
no ip domain-lookup
ip cef
!
interface GigabitEthernet0/0
 description LINK_ISP-A
 ip address 10.10.0.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description LINK_ISP-B
 ip address 10.10.0.14 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/2
 description LINK_EXT-HOST
 ip address 198.51.100.1 255.255.255.0
 no shutdown
!
ip prefix-list PFX_EXT seq 5 permit 198.51.100.0/24
ip prefix-list PFX_CLIENT_A seq 5 permit 203.0.113.0/24
!
route-map PREFER_ISP_A permit 10
 match ip address prefix-list PFX_CLIENT_A
 set local-preference 200
!
router bgp 65300
 bgp router-id 198.51.100.1
 bgp log-neighbor-changes
 network 198.51.100.0 mask 255.255.255.0
 neighbor 10.10.0.9 remote-as 65100
 neighbor 10.10.0.9 prefix-list PFX_CLIENT_A in
 neighbor 10.10.0.9 prefix-list PFX_EXT out
 neighbor 10.10.0.9 route-map PREFER_ISP_A in
 neighbor 10.10.0.13 remote-as 65200
 neighbor 10.10.0.13 prefix-list PFX_CLIENT_A in
 neighbor 10.10.0.13 prefix-list PFX_EXT out
!
end
