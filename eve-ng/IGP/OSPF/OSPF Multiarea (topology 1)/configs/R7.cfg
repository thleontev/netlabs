!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R7
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
!
!
!
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
key chain OSPF_KEY
 key 1
  key-string cisco
  cryptographic-algorithm hmac-sha-512
!
!
!
redundancy
!
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 no shutdown
 ip address 10.7.7.7 255.255.255.255
!
interface GigabitEthernet0/0
 no shutdown
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 no shutdown
 description to SW1
 ip address 50.0.167.7 255.255.255.0
 ip ospf message-digest-key 1 md5 cisco
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 no shutdown
 description to XR3
 ip address 50.1.37.7 255.255.255.0
 ip ospf message-digest-key 1 md5 cisco
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no shutdown
 description to R8
 ip address 192.168.78.7 255.255.255.0
 ip ospf authentication key-chain OSPF_KEY
 duplex auto
 speed auto
 media-type rj45
!
router ospf 1
 router-id 10.7.7.7
 area 0 authentication message-digest
 network 10.10.10.10 0.0.0.0 area 0
 network 50.0.167.0 0.0.0.255 area 0
 network 50.1.37.0 0.0.0.255 area 0
 network 192.168.78.0 0.0.0.255 area 0
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
!
ipv6 ioam timestamp
!
!
!
control-plane
!
banner exec ^C
