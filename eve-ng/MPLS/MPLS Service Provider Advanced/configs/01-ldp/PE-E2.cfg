enable
configure terminal
hostname PE-E2
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO_P3
 ip address 172.20.13.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 30
 mpls ip
!
interface GigabitEthernet0/1
 description TO_P4
 ip address 172.20.14.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 mpls ip
!
interface GigabitEthernet0/2
 description TO_CE-A-E2
 ip address 10.11.5.1 255.255.255.252
 no shutdown
!
interface Loopback0
 ip ospf 100 area 0
!
router ospf 100
 router-id 10.255.0.4
 passive-interface Loopback0
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
end
