enable
configure terminal
hostname P2
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.255.0.12 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO_PE-W1
 ip address 172.20.2.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 30
!
interface GigabitEthernet0/1
 description TO_PE-W2
 ip address 172.20.4.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface GigabitEthernet0/2
 description TO_P1
 ip address 172.20.5.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 20
!
interface GigabitEthernet0/3
 description TO_P3
 ip address 172.20.8.1 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 35
!
interface GigabitEthernet0/4
 description TO_P4
 ip address 172.20.9.1 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface Loopback0
 ip ospf 100 area 0
!
router ospf 100
 router-id 10.255.0.12
 passive-interface Loopback0
!
end
