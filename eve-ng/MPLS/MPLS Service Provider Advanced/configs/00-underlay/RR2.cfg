enable
configure terminal
hostname RR2
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.255.0.22 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO_P4
 ip address 172.20.16.1 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface Loopback0
 ip ospf 100 area 0
!
router ospf 100
 router-id 10.255.0.22
 passive-interface Loopback0
!
end
