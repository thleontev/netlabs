enable
configure terminal
hostname PE-E1
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.255.0.3 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO_P3
 ip address 172.20.11.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface GigabitEthernet0/1
 description TO_P4
 ip address 172.20.12.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 30
!
interface GigabitEthernet0/2
 description TO_CE-A-E1
 ip address 10.11.4.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description TO_CE-B-E
 ip address 10.12.2.1 255.255.255.252
 no shutdown
!
interface Loopback0
 ip ospf 100 area 0
!
router ospf 100
 router-id 10.255.0.3
 passive-interface Loopback0
!
end
