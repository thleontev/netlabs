enable
configure terminal
hostname P4
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.255.0.14 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO_P1
 ip address 172.20.7.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 35
!
interface GigabitEthernet0/1
 description TO_P2
 ip address 172.20.9.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface GigabitEthernet0/2
 description TO_P3
 ip address 172.20.10.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 20
!
interface GigabitEthernet0/3
 description TO_PE-E1
 ip address 172.20.12.1 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 30
!
interface GigabitEthernet0/4
 description TO_PE-E2
 ip address 172.20.14.1 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface GigabitEthernet0/5
 description TO_RR2
 ip address 172.20.16.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface Loopback0
 ip ospf 100 area 0
!
router ospf 100
 router-id 10.255.0.14
 passive-interface Loopback0
!
end
