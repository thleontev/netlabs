enable
configure terminal
hostname P3
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.255.0.13 255.255.255.255
 no shutdown
!
interface GigabitEthernet0/0
 description TO_P1
 ip address 172.20.6.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 mpls ip
!
interface GigabitEthernet0/1
 description TO_P2
 ip address 172.20.8.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 35
 mpls ip
!
interface GigabitEthernet0/2
 description TO_P4
 ip address 172.20.10.1 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 20
 mpls ip
!
interface GigabitEthernet0/3
 description TO_PE-E1
 ip address 172.20.11.1 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 mpls ip
!
interface GigabitEthernet0/4
 description TO_PE-E2
 ip address 172.20.13.1 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 30
 mpls ip
!
interface Loopback0
 ip ospf 100 area 0
!
router ospf 100
 router-id 10.255.0.13
 passive-interface Loopback0
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
end
