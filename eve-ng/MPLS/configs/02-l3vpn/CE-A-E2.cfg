enable
configure terminal
hostname CE-A-E2
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.100.4.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0
 description TO_PE-E2
 ip address 10.11.5.2 255.255.255.252
 no shutdown
!
router bgp 65140
 bgp log-neighbor-changes
 network 10.100.4.0 mask 255.255.255.0
 neighbor 10.11.5.1 remote-as 65000
!
end
