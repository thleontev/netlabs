enable
configure terminal
hostname CE-B-W
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.100.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0
 description TO_PE-W1
 ip address 10.12.1.2 255.255.255.252
 no shutdown
!
router bgp 65210
 bgp log-neighbor-changes
 network 10.100.1.0 mask 255.255.255.0
 neighbor 10.12.1.1 remote-as 65000
!
end
