enable
configure terminal
hostname CE-A-W1
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.100.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/0
 description TO_PE-W1
 ip address 10.11.1.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description TO_PE-W2
 ip address 10.11.2.2 255.255.255.252
 no shutdown
!
router bgp 65110
 bgp log-neighbor-changes
 network 10.100.1.0 mask 255.255.255.0
 neighbor 10.11.1.1 remote-as 65000
 neighbor 10.11.1.1 weight 500
 neighbor 10.11.2.1 remote-as 65000
!
end
