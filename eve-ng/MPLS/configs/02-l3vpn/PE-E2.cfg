enable
configure terminal
hostname PE-E2
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
 no shutdown
!
ip vrf CUST_A
 rd 65000:1004
 route-target export 65000:100
 route-target import 65000:100
!
ip vrf CUST_B
 rd 65000:2004
 route-target export 65000:200
 route-target import 65000:200
!
interface GigabitEthernet0/0
 description TO_P3
 ip address 172.20.13.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 30
 mpls ip
!
interface GigabitEthernet0/1
 description TO_P4
 ip address 172.20.14.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 mpls ip
!
interface GigabitEthernet0/2
 description TO_CE-A-E2
 ip vrf forwarding CUST_A
 ip address 10.11.5.1 255.255.255.252
 no shutdown
!
interface Loopback0
 ip ospf 100 area 0
!
router ospf 100
 router-id 10.255.0.4
 passive-interface Loopback0
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
router bgp 65000
 bgp router-id 10.255.0.4
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.0.21 remote-as 65000
 neighbor 10.255.0.21 update-source Loopback0
 neighbor 10.255.0.22 remote-as 65000
 neighbor 10.255.0.22 update-source Loopback0
 address-family vpnv4
  neighbor 10.255.0.21 activate
  neighbor 10.255.0.21 send-community extended
  neighbor 10.255.0.22 activate
  neighbor 10.255.0.22 send-community extended
 exit-address-family
 address-family ipv4 vrf CUST_A
  neighbor 10.11.5.2 remote-as 65140
  neighbor 10.11.5.2 activate
 exit-address-family
!
end
