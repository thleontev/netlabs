enable
configure terminal
hostname PE-E1
no ip domain-lookup
ip cef
no logging console
!
interface Loopback0
 ip address 10.255.0.3 255.255.255.255
 no shutdown
!
ip vrf CUST_A
 rd 65000:1003
 route-target export 65000:100
 route-target import 65000:100
!
ip vrf CUST_B
 rd 65000:2003
 route-target export 65000:200
 route-target import 65000:200
!
interface GigabitEthernet0/0
 description TO_P3
 ip address 172.20.11.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 mpls ip
!
interface GigabitEthernet0/1
 description TO_P4
 ip address 172.20.12.2 255.255.255.252
 no shutdown
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 30
 mpls ip
!
interface GigabitEthernet0/2
 description TO_CE-A-E1
 ip vrf forwarding CUST_A
 ip address 10.11.4.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/3
 description TO_CE-B-E
 ip vrf forwarding CUST_B
 ip address 10.12.2.1 255.255.255.252
 no shutdown
!
interface Loopback0
 ip ospf 100 area 0
!
router ospf 100
 router-id 10.255.0.3
 passive-interface Loopback0
!
mpls label protocol ldp
mpls ldp router-id Loopback0 force
!
router bgp 65000
 bgp router-id 10.255.0.3
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 10.255.0.21 remote-as 65000
 neighbor 10.255.0.21 update-source Loopback0
 neighbor 10.255.0.22 remote-as 65000
 neighbor 10.255.0.22 update-source Loopback0
 address-family vpnv4
  neighbor 10.255.0.21 activate
  neighbor 10.255.0.21 send-community extended
  neighbor 10.255.0.22 activate
  neighbor 10.255.0.22 send-community extended
 exit-address-family
 address-family ipv4 vrf CUST_A
  neighbor 10.11.4.2 remote-as 65130
  neighbor 10.11.4.2 activate
 exit-address-family
 address-family ipv4 vrf CUST_B
  neighbor 10.12.2.2 remote-as 65220
  neighbor 10.12.2.2 activate
 exit-address-family
!
end
