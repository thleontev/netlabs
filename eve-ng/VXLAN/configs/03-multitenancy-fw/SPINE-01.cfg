! SPINE-01 | Stage: OSPF UNDERLAY | NX-OSv9k 9.3(x)
hostname SPINE-01
feature ospf
feature bgp
feature nv overlay
feature vn-segment-vlan-based
feature interface-vlan
! OSPF ECMP across SPINE-01 and SPINE-02
interface loopback0
  ip address 10.255.0.11/32
  ip router ospf UNDERLAY area 0.0.0.0
interface Ethernet1/1
  no switchport
  ip address 10.0.11.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown
interface Ethernet1/2
  no switchport
  ip address 10.0.12.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown
interface Ethernet1/3
  no switchport
  ip address 10.0.13.1/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown
router ospf UNDERLAY
  router-id 10.255.0.11
router bgp 65000
  router-id 10.255.0.11
  neighbor 10.255.0.21
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community both
      route-reflector-client
  neighbor 10.255.0.22
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community both
      route-reflector-client
  neighbor 10.255.0.23
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community both
      route-reflector-client

! End. Save: copy running-config startup-config
