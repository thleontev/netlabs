! LEAF-01 | Stage: OSPF UNDERLAY | NX-OSv9k 9.3(x)
hostname LEAF-01
feature ospf
feature bgp
feature nv overlay
feature vn-segment-vlan-based
feature interface-vlan
! OSPF ECMP across SPINE-01 and SPINE-02
interface loopback0
  ip address 10.255.0.21/32
  ip router ospf UNDERLAY area 0.0.0.0
interface loopback1
  ip address 10.254.0.21/32
  ip router ospf UNDERLAY area 0.0.0.0
interface Ethernet1/1
  no switchport
  ip address 10.0.11.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown
interface Ethernet1/2
  no switchport
  ip address 10.0.21.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown
router ospf UNDERLAY
  router-id 10.255.0.21

! End. Save: copy running-config startup-config
