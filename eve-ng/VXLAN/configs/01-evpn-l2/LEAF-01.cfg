! LEAF-01 | Stage: OSPF UNDERLAY | NX-OSv9k 9.3(x)
hostname LEAF-01
feature ospf
feature bgp
feature nv overlay
feature vn-segment-vlan-based
feature interface-vlan
! OSPF ECMP across SPINE-01 and SPINE-02
interface loopback0
  ip address 10.255.0.21/32
  ip router ospf UNDERLAY area 0.0.0.0
interface loopback1
  ip address 10.254.0.21/32
  ip router ospf UNDERLAY area 0.0.0.0
interface Ethernet1/1
  no switchport
  ip address 10.0.11.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown
interface Ethernet1/2
  no switchport
  ip address 10.0.21.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown
router ospf UNDERLAY
  router-id 10.255.0.21
! Local VLAN/VNI only; consistent RT wherever VNI exists
vlan 10
  name CLIENTS
  vn-segment 10010
vlan 20
  name APPLICATIONS
  vn-segment 10020
interface Ethernet1/3
  switchport
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown
interface Ethernet1/4
  switchport
  switchport access vlan 20
  spanning-tree port type edge
  no shutdown
interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  member vni 10010
    ingress-replication protocol bgp
  member vni 10020
    ingress-replication protocol bgp
router bgp 65000
  router-id 10.255.0.21
  neighbor 10.255.0.11
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community both
  neighbor 10.255.0.12
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community both
evpn
  vni 10010 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10020 l2
    rd auto
    route-target import auto
    route-target export auto

! End. Save: copy running-config startup-config
