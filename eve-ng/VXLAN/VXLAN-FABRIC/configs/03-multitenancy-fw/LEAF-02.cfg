! LEAF-02 | Stage: OSPF UNDERLAY | NX-OSv9k 9.3(x)
hostname LEAF-02
feature ospf
feature bgp
feature nv overlay
feature vn-segment-vlan-based
feature interface-vlan
! OSPF ECMP across SPINE-01 and SPINE-02
interface loopback0
  ip address 10.255.0.22/32
  ip router ospf UNDERLAY area 0.0.0.0
interface loopback1
  ip address 10.254.0.22/32
  ip router ospf UNDERLAY area 0.0.0.0
interface Ethernet1/1
  no switchport
  ip address 10.0.12.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown
interface Ethernet1/2
  no switchport
  ip address 10.0.22.0/31
  ip ospf network point-to-point
  ip router ospf UNDERLAY area 0.0.0.0
  no shutdown
router ospf UNDERLAY
  router-id 10.255.0.22
! Local VLAN/VNI only; consistent RT wherever VNI exists
vlan 10
  name CLIENTS
  vn-segment 10010
vlan 30
  name DATABASES
  vn-segment 10030
interface Ethernet1/3
  switchport
  switchport access vlan 10
  spanning-tree port type edge
  no shutdown
interface Ethernet1/4
  switchport
  switchport access vlan 30
  spanning-tree port type edge
  no shutdown
interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback1
  member vni 10010
    ingress-replication protocol bgp
  member vni 10030
    ingress-replication protocol bgp
router bgp 65000
  router-id 10.255.0.22
  neighbor 10.255.0.11
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community both
  neighbor 10.255.0.12
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community both
evpn
  vni 10010 l2
    rd auto
    route-target import auto
    route-target export auto
  vni 10030 l2
    rd auto
    route-target import auto
    route-target export auto
vlan 110
  name CLIENTS_L3VNI
  vn-segment 50110
vrf context CLIENTS
  vni 50110
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn
interface Vlan110
  no shutdown
  vrf member CLIENTS
  ip forward
vlan 220
  name APPS_L3VNI
  vn-segment 50220
vrf context APPS
  vni 50220
  rd auto
  address-family ipv4 unicast
    route-target both auto
    route-target both auto evpn
interface Vlan220
  no shutdown
  vrf member APPS
  ip forward
! Distributed anycast gateway; same IP and MAC on every leaf
fabric forwarding anycast-gateway-mac 0000.1234.5678
interface Vlan10
  no shutdown
  vrf member CLIENTS
  ip address 192.168.10.1/24 tag 56363
  fabric forwarding mode anycast-gateway
interface Vlan30
  no shutdown
  vrf member APPS
  ip address 192.168.30.1/24 tag 56363
  fabric forwarding mode anycast-gateway
interface nve1
  member vni 50110 associate-vrf
  member vni 50220 associate-vrf
route-map RM_SVI permit 10
  match tag 56363
route-map RM_FIREWALL permit 10
  match tag 101
router bgp 65000
  vrf CLIENTS
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map RM_SVI
      redistribute static route-map RM_FIREWALL
  vrf APPS
    address-family ipv4 unicast
      advertise l2vpn evpn
      redistribute direct route-map RM_SVI
      redistribute static route-map RM_FIREWALL
! Only LEAF-02 connects to firewall: two different tenant VRFs
interface Ethernet1/5
  no switchport
  vrf member CLIENTS
  ip address 172.31.10.1/30
  no shutdown
interface Ethernet1/6
  no switchport
  vrf member APPS
  ip address 172.31.20.1/30
  no shutdown
vrf context CLIENTS
  ip route 192.168.20.0/24 172.31.10.2 tag 101
  ip route 192.168.30.0/24 172.31.10.2 tag 101
vrf context APPS
  ip route 192.168.10.0/24 172.31.20.2 tag 101

! End. Save: copy running-config startup-config
